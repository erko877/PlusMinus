<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>+- (PlusMinus by Gold Games)</title>
    <style>
        :root {
            --bg-color: #2c3e50;
            --bg-accent: #27ae60;
            --card-width: 68px; 
            --card-height: 100px;
            --radius: 8px;
            --accent: #f1c40f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: radial-gradient(circle at center, var(--bg-accent), var(--bg-color));
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- HEADER --- */
        #top-bar {
            height: 50px; display: flex; justify-content: space-between; align-items: center; padding: 0 15px;
            background: rgba(0,0,0,0.3); font-size: 0.9rem;
        }
        .header-left { display: flex; gap: 15px; align-items: center; }
        
        #timer-display {
            font-family: monospace; font-size: 1.2rem; font-weight: bold; 
            background: rgba(0,0,0,0.3); padding: 4px 10px; border-radius: 5px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        #restart-btn {
            background: #c0392b; color: white; border: none; padding: 6px 15px;
            border-radius: 20px; font-weight: bold; cursor: pointer;
        }

        /* --- START SCREEN --- */
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 300;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .sel-btn-container { display: flex; gap: 20px; margin-top: 30px; }
        .sel-btn {
            width: 90px; height: 90px; border-radius: 50%; border: none;
            background: var(--accent); color: #2c3e50; font-size: 1.5rem; font-weight: bold;
            cursor: pointer; box-shadow: 0 0 20px rgba(241, 196, 15, 0.3);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: transform 0.1s;
        }
        .sel-btn:active { transform: scale(0.95); }
        .sel-btn span { font-size: 0.8rem; margin-top: 5px; font-weight: normal; }

        /* --- GAME UI --- */
        #game-container {
            flex: 1; display: none; flex-direction: column; position: relative;
        }

        #opponents-area {
            flex: 1; display: flex; justify-content: space-around; align-items: center;
        }
        .opponent { text-align: center; opacity: 0.6; transition: 0.3s; position: relative; }
        .opponent.active { opacity: 1; transform: scale(1.15); font-weight: bold; color: var(--accent); }
        .bubble {
            position: absolute; top: -35px; left: 50%; transform: translateX(-50%);
            background: white; color: #333; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem;
            opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; font-weight:bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3); z-index: 50;
        }

        /* CENTER AREA */
        #play-area {
            flex: 3; display: flex; flex-direction: column; justify-content: center; align-items: center;
            position: relative;
        }

        #center-stack {
            position: relative; 
            width: var(--card-width); 
            height: var(--card-height);
            display: flex; justify-content: center; align-items: center;
        }
        
        #active-card {
            transform: scale(1.6); 
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: white; color: #2c3e50; border: 4px solid white;
        }
        .pulse-anim { animation: pulse 0.4s; }
        @keyframes pulse { 50% { transform: scale(1.8); } }

        /* PLAYER AREA */
        #player-area {
            flex: 0 0 250px; 
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 10px;
        }
        #message-area { text-align: center; height: 30px; color: var(--accent); font-weight: bold; font-size: 1.1rem; text-shadow: 0 2px 2px rgba(0,0,0,0.8); margin-bottom: 5px; }
        #hand-container {
            display: flex; justify-content: center; flex-wrap: wrap; gap: 8px;
            padding: 10px; overflow-y: auto; min-height: 110px;
        }

        /* --- CARDS --- */
        .card {
            width: var(--card-width); height: var(--card-height);
            border-radius: var(--radius);
            display: flex; justify-content: center; align-items: center;
            font-weight: 800; font-size: 1.6rem;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.4);
            cursor: pointer; position: relative;
            background: white; color: #333; border: 2px solid white;
            transition: transform 0.2s; user-select: none;
        }
        .card.number { background-color: #ecf0f1 !important; color: #2c3e50 !important; }
        .card.plus   { background-color: #007bff !important; color: white !important; border-color: #0056b3 !important; }
        .card.minus  { background-color: #ff8c00 !important; color: white !important; border-color: #e67e22 !important; }
        .card.joker  { background-color: #9b59b6 !important; color: white !important; border-color: #8e44ad !important; }
        .card.skip   { background-color: #7f8c8d !important; color: white !important; border-color: #95a5a6 !important; }
        .card.draw2  { background-color: #e74c3c !important; color: white !important; border-color: #c0392b !important; }

        .card.selected { transform: translateY(-20px) scale(1.15); border-color: var(--accent) !important; z-index: 100; box-shadow: 0 0 15px var(--accent); }
        .flying { position: fixed; z-index: 1000; pointer-events: none; transition: all 0.5s ease-in-out; }

        /* CONTROLS */
        #controls { display: flex; justify-content: center; gap: 20px; padding: 15px; }
        button.game-btn {
            padding: 12px 30px; border-radius: 10px; border: none; font-weight: bold; font-size: 1rem;
            box-shadow: 0 4px 0 rgba(0,0,0,0.3); cursor: pointer; transition: all 0.1s;
        }
        button.game-btn:active { transform: translateY(4px); box-shadow: none; }
        #btn-draw { background: #ecf0f1; color: #333; }
        #btn-play { background: #27ae60; color: white; opacity: 0.5; }
        #btn-play.ready { opacity: 1; animation: glow 1.5s infinite; background: #2ecc71; }
        @keyframes glow { 0% { box-shadow: 0 0 5px #2ecc71; } 50% { box-shadow: 0 0 20px #2ecc71; } 100% { box-shadow: 0 0 5px #2ecc71; } }

        /* MODALS */
        #modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 500;
        }
        .modal-box { background: white; color: #333; padding: 25px; border-radius: 15px; text-align: center; width: 90%; max-width: 320px; }
        .grid-1-10 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 20px; }

        #toast {
            position: fixed; top: 120px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.9); padding: 12px 25px; border-radius: 30px; color: white;
            pointer-events: none; opacity: 0; transition: opacity 0.5s; z-index: 400; font-weight: bold;
        }
    </style>
</head>
<body>

<div id="top-bar">
    <div class="header-left">
        <div style="font-weight:900; font-size:1.2rem;">+- by GoldGames</div>
        <div id="timer-display">00:00</div>
    </div>
    <div style="display:flex; gap:10px; align-items:center;">
        <span id="deck-info" style="opacity:0.8; font-size:0.8rem;"></span>
        <button id="restart-btn" onclick="location.reload()">Neustart</button>
    </div>
</div>

<!-- START SCREEN -->
<div id="start-screen">
    <h1 style="color:white; font-size:4rem; margin:0; text-shadow:0 6px 15px black;">+-</h1>
    <p style="color:#bdc3c7;">Strategisches Rechenspiel</p>
    <div class="sel-btn-container">
        <button class="sel-btn" onclick="prepareGame(1)">1<span>Gegner</span></button>
        <button class="sel-btn" onclick="prepareGame(2)">2<span>Gegner</span></button>
        <button class="sel-btn" onclick="prepareGame(3)">3<span>Gegner</span></button>
    </div>
</div>

<!-- GAME UI -->
<div id="game-container">
    <div id="opponents-area"></div>

    <div id="play-area">
        <div id="center-stack">
            <div id="active-card" class="card number">?</div>
        </div>
    </div>

    <div id="player-area">
        <div id="message-area"></div>
        <div id="hand-container"></div>
    </div>
</div>

<div id="controls">
    <button id="btn-draw" class="game-btn">Ziehen</button>
    <button id="btn-play" class="game-btn" disabled>Legen</button>
</div>

<div id="toast">Nachricht</div>

<div id="modal-overlay">
    <div class="modal-box">
        <h3>Wähle eine Zahl</h3>
        <div class="grid-1-10" id="joker-grid"></div>
        <button style="margin-top:15px; background:#95a5a6; border:none; padding:10px; border-radius:5px; color:white; font-weight:bold; cursor:pointer;" onclick="closeModal()">Abbrechen</button>
    </div>
</div>

<script>
/**
 * ------------------------------------------------------------------
 * LOGIK (MODEL)
 * ------------------------------------------------------------------
 */
const TYPE = { NUMBER:'number', PLUS:'plus', MINUS:'minus', JOKER:'joker', SKIP:'skip', DRAW2:'draw2' };

class Card {
    constructor(type, value=null) {
        this.type = type;
        this.value = value;
        this.id = Math.random().toString(36).substring(2);
    }
    toString() {
        if(this.type === TYPE.NUMBER) return this.value;
        if(this.type === TYPE.PLUS) return "+";
        if(this.type === TYPE.MINUS) return "−";
        if(this.type === TYPE.JOKER) return "★";
        if(this.type === TYPE.SKIP) return "🚫";
        if(this.type === TYPE.DRAW2) return "+2";
        return "?";
    }
    getSortIndex() {
        // Leichter Random-Faktor für natürliche Hand-Sortierung
        return Math.random();
    }
}

class Deck {
    constructor() { this.init(); }
    init() {
        this.cards = []; this.discardPile = [];
        // DECK ZUSAMMENSETZUNG (Total 106)
        // 1. Zahlen 1-10 (je 7x) = 70
        for(let i=1; i<=10; i++) for(let k=0; k<7; k++) this.cards.push(new Card(TYPE.NUMBER, i));
        // 2. Operatoren (je 11x) = 22
        for(let k=0; k<11; k++) { this.cards.push(new Card(TYPE.PLUS)); this.cards.push(new Card(TYPE.MINUS)); }
        // 3. Joker (4x) = 4
        for(let k=0; k<4; k++) this.cards.push(new Card(TYPE.JOKER));
        // 4. Aussetzer (6x) = 6
        for(let k=0; k<6; k++) this.cards.push(new Card(TYPE.SKIP));
        // 5. +2 (4x) = 4
        for(let k=0; k<4; k++) this.cards.push(new Card(TYPE.DRAW2));
        
        console.log("Deck Check:", this.cards.length); // Soll 106 sein
        this.shuffle(this.cards);
    }
    shuffle(arr) {
        // Fisher-Yates Shuffle
        for(let i=arr.length-1; i>0; i--) {
            const j = Math.floor(Math.random()*(i+1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
    }
    draw() {
        if(this.cards.length===0) {
            if(this.discardPile.length===0) return null;
            this.cards = [...this.discardPile]; this.discardPile=[]; this.shuffle(this.cards);
            ui.showToast("Deck neu gemischt");
        }
        return this.cards.pop();
    }
}

class Rules {
    /**
     * Prüft, ob die gelegten Karten (cards) zusammen das target ergeben.
     * Joker können hierbei Zahl oder Operator sein.
     */
    static validate(target, cards, jokerVal=null) {
        if(cards.length === 0) return { ok: false };
        const c0 = cards[0];

        // 1. EINZELKARTE
        if(cards.length === 1) {
            if(c0.type === TYPE.NUMBER) return c0.value === target ? { ok: true, nextTarget: c0.value } : { ok: false };
            if(c0.type === TYPE.JOKER) return jokerVal ? { ok: true, nextTarget: jokerVal, isJoker: true } : { ok: true, needInput: true };
            if(c0.type === TYPE.SKIP) return { ok: true, isSkip: true, nextTarget: target };
            if(c0.type === TYPE.DRAW2) return { ok: true, isDraw2: true, nextTarget: target };
            return { ok: false };
        }

        // 2. KETTEN-RECHNUNG
        // Muster muss sein: Z O Z O Z ...
        // Joker werden automatisch "erraten".

        // Wir bauen alle möglichen Werte für jede Position auf
        // Index 0, 2, 4... muss ZAHL sein (oder Joker als Zahl)
        // Index 1, 3, 5... muss OPERATOR sein (oder Joker als Op)

        // Simpler Recursive Solver für Joker
        return this.solveChain(target, cards, 0, 0, null);
    }

    static solveChain(target, cards, index, currentVal, lastNumVal) {
        const card = cards[index];
        const isNumPos = (index % 2 === 0);

        // -- BASIS: Letzte Karte erreicht --
        if(index === cards.length) {
            if(currentVal === target) {
                // Erfolg! Das neue Ziel ist der Wert der letzten Zahl-Karte
                // Wenn letzte Karte ein Joker war, muss dieser aufgelöst sein.
                return { ok: true, nextTarget: lastNumVal };
            }
            return { ok: false };
        }

        // -- REKURSION --
        
        // Fall A: Position erwartet ZAHL
        if(isNumPos) {
            let possibleValues = [];
            
            if(card.type === TYPE.NUMBER) possibleValues.push(card.value);
            else if(card.type === TYPE.JOKER) {
                // Joker als Zahl: Kann alles sein 1..10
                // Performance: Wir probieren das, was nötig wäre?
                // Brute force 1..10 ist bei max 5 Karten kein Problem.
                for(let v=1; v<=10; v++) possibleValues.push(v);
            } else {
                return { ok: false }; // Operator an falscher Stelle
            }

            for(let v of possibleValues) {
                let nextVal = currentVal;
                // Erste Zahl vs Folgende
                if(index === 0) {
                    nextVal = v;
                } else {
                    // Wir brauchen den Operator davor (Index-1)
                    // Da wir rekursiv sind, haben wir den Op nicht gespeichert.
                    // Fehler im Ansatz: Wir müssen den Operator "mitnehmen".
                    // Besser: Iterativ den Joker auflösen.
                }
            }
        }
        
        // Neuer Ansatz: Iterativer Solver mit Branching für Joker
        // Wir speichern den aktuellen Pfad (Werte)
        let paths = [{ val: 0, lastNum: 0, waitingForOp: false, lastOp: null }]; // Start state

        for (let i = 0; i < cards.length; i++) {
            const c = cards[i];
            let newPaths = [];

            for (let p of paths) {
                // Erwartet Zahl (Start oder nach Op)
                if (!p.waitingForOp) {
                    let nums = [];
                    if (c.type === TYPE.NUMBER) nums.push(c.value);
                    else if (c.type === TYPE.JOKER) {
                        // Optimierung: Wenn wir Operator haben, berechne nötige Zahl
                        if (p.lastOp) {
                            // val +/- X = target ?? Nein, wir wissen Target noch nicht am Ende.
                            // Joker als Zahl = 1..10
                            for(let n=1; n<=10; n++) nums.push(n);
                        } else {
                            // Erste Karte ist Joker: 1..10
                            for(let n=1; n<=10; n++) nums.push(n);
                        }
                    } else {
                        continue; // Invalid type
                    }

                    for (let n of nums) {
                        let newVal = p.val;
                        if (i === 0) newVal = n;
                        else {
                            if (p.lastOp === '+') newVal += n;
                            else if (p.lastOp === '-') newVal -= n;
                        }
                        newPaths.push({ val: newVal, lastNum: n, waitingForOp: true, lastOp: null });
                    }
                } 
                // Erwartet Operator
                else {
                    let ops = [];
                    if (c.type === TYPE.PLUS) ops.push('+');
                    else if (c.type === TYPE.MINUS) ops.push('-');
                    else if (c.type === TYPE.JOKER) {
                        ops.push('+'); ops.push('-');
                    } else {
                        continue; // Invalid
                    }

                    for (let op of ops) {
                        newPaths.push({ val: p.val, lastNum: p.lastNum, waitingForOp: false, lastOp: op });
                    }
                }
            }
            paths = newPaths;
        }

        // Am Ende prüfen
        for (let p of paths) {
            if (p.waitingForOp && p.val === target) {
                // Valid chain found!
                return { ok: true, nextTarget: p.lastNum };
            }
        }

        return { ok: false };
    }
}

/**
 * ------------------------------------------------------------------
 * GAME STATE
 * ------------------------------------------------------------------
 */
const gm = {
    deck: null,
    players: [],
    turn: 0,
    target: 5,
    active: false,
    drawn: false,
    startTime: 0,
    timerInterval: null,

    init(botCount) {
        this.deck = new Deck();
        this.players = [{ name:"DU", isBot:false, hand:[] }];
        for(let i=1; i<=botCount; i++) this.players.push({ name:`Bot ${i}`, isBot:true, hand:[] });
        
        this.players.forEach(p => {
            for(let i=0; i<10; i++) p.hand.push(this.deck.draw());
            // Hand nicht strikt sortieren für Joker-Übersicht
        });

        let c = this.deck.draw();
        while(c.type !== TYPE.NUMBER) {
            this.deck.discardPile.push(c);
            c = this.deck.draw();
        }
        this.target = c.value;
    },

    setTurn(idx) {
        this.turn = idx;
        this.active = true;
        this.startTimer();
        ui.initGameScreen();
        ui.showToast(`${this.players[idx].name} fängt an!`);
        this.nextTurn(false);
    },

    startTimer() {
        this.startTime = Date.now();
        if(this.timerInterval) clearInterval(this.timerInterval);
        this.timerInterval = setInterval(() => {
            const diff = Math.floor((Date.now() - this.startTime) / 1000);
            const m = Math.floor(diff / 60).toString().padStart(2,'0');
            const s = (diff % 60).toString().padStart(2,'0');
            document.getElementById('timer-display').innerText = `${m}:${s}`;
        }, 1000);
    },

    nextTurn(advance=true) {
        if(!this.active) return;
        if(advance) this.turn = (this.turn + 1) % this.players.length;
        this.drawn = false;
        
        const p = this.players[this.turn];
        ui.updateActive(this.turn);
        ui.clearBubble();

        if(p.isBot) {
            ui.lock(true);
            setTimeout(() => this.botMove(p), 1200);
        } else {
            ui.lock(false);
            ui.msg(`Ziel: ${this.target} | Du bist dran!`);
        }
    },

    handleDraw(p) {
        const c = this.deck.draw();
        if(!c) return;
        p.hand.push(c);
        ui.updateDeckInfo();

        if(p.isBot) {
            ui.showBubble(this.turn, "Zieht...");
            ui.updateOpponents();
            setTimeout(() => this.nextTurn(), 1000);
        } else {
            ui.renderHand(p);
            this.drawn = true;
            ui.msg("Gezogen. Spielen?");
            ui.btnDraw.innerText = "Weiter";
        }
    },

    execute(p, cards, jokerVal) {
        const res = Rules.validate(this.target, cards, jokerVal);
        if(!res.ok) return;

        p.hand = p.hand.filter(c => !cards.includes(c));
        cards.forEach(c => this.deck.discardPile.push(c));
        
        ui.playAnimation(p, cards, () => {
            this.target = res.nextTarget;
            ui.updateCenterCard(this.target);
            ui.updateOpponents();
            if(!p.isBot) ui.renderHand(p);

            if(p.hand.length === 0) {
                this.active = false;
                clearInterval(this.timerInterval);
                setTimeout(() => alert(p.name + " hat gewonnen!"), 200);
                return;
            }

            if(res.isSkip) {
                ui.showBubble(this.turn, "🚫 Aussetzer!");
                this.turn = (this.turn + 1) % this.players.length; 
                setTimeout(() => this.nextTurn(), 1500);
            } 
            else if(res.isDraw2) {
                ui.showBubble(this.turn, "💥 +2 Karten!");
                const victimIdx = (this.turn + 1) % this.players.length;
                const victim = this.players[victimIdx];
                victim.hand.push(this.deck.draw());
                victim.hand.push(this.deck.draw());
                if(victimIdx === 0) {
                    ui.msg("Du musst 2 ziehen!");
                    ui.renderHand(victim);
                } else {
                    ui.showBubble(victimIdx, "Muss 2 ziehen...");
                    ui.updateOpponents();
                }
                this.turn = victimIdx; 
                setTimeout(() => this.nextTurn(), 2000);
            } 
            else {
                this.nextTurn();
            }
        });
    },

    botMove(p) {
        const t = this.target;

        // 1. Specials
        const special = p.hand.find(c => c.type === TYPE.DRAW2 || c.type === TYPE.SKIP);
        if(special && Math.random() > 0.6) return this.execute(p, [special]);

        // 2. Direct Match (incl Joker as Number)
        const match = p.hand.find(c => c.type === TYPE.NUMBER && c.value === t);
        if(match) return this.execute(p, [match]);

        // 3. Calculation
        // Wir suchen simple N+N oder N-N Lösungen.
        // Komplexere Joker-Ketten (z.B. Joker + 5 = Target) sind für einfache Bots schwer, 
        // wir implementieren eine Basis-Logik für Joker als Operator.
        
        const nums = p.hand.filter(c => c.type === TYPE.NUMBER);
        const ops = p.hand.filter(c => c.type === TYPE.PLUS || c.type === TYPE.MINUS || c.type === TYPE.JOKER);

        for(let n1 of nums) {
            for(let op of ops) {
                for(let n2 of nums) {
                    if(n1 === n2) continue;
                    
                    // Prüfe ob valide (Joker wird hier simuliert)
                    const check = Rules.validate(t, [n1, op, n2]);
                    if(check.ok) {
                        return this.execute(p, [n1, op, n2]);
                    }
                }
            }
        }
        
        // 4. Joker Single
        const joker = p.hand.find(c => c.type === TYPE.JOKER);
        if(joker) return this.execute(p, [joker], Math.floor(Math.random()*10)+1);

        this.handleDraw(p);
    }
};

/**
 * ------------------------------------------------------------------
 * UI MANAGER
 * ------------------------------------------------------------------
 */
const ui = {
    sel: [],
    
    initGameScreen() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('game-container').style.display = 'flex';
        this.btnDraw = document.getElementById('btn-draw');
        this.btnPlay = document.getElementById('btn-play');
        this.handDiv = document.getElementById('hand-container');
        this.centerCard = document.getElementById('active-card');
        this.msgDiv = document.getElementById('message-area');

        this.btnDraw.onclick = () => {
            if(gm.drawn) gm.nextTurn();
            else gm.handleDraw(gm.players[0]);
        };
        this.btnPlay.onclick = () => this.tryPlay();
        
        this.renderOpponents();
        this.renderHand(gm.players[0]);
        this.updateDeckInfo();
        this.updateCenterCard(gm.target);
    },

    createCardEl(c, small=false) {
        const div = document.createElement('div');
        div.className = `card ${c.type}`;
        div.innerText = c.toString();
        if(small) { div.style.width='40px'; div.style.height='60px'; div.style.fontSize='1rem'; }
        return div;
    },

    renderHand(p) {
        this.handDiv.innerHTML = '';
        p.hand.forEach(c => {
            const el = this.createCardEl(c);
            if(this.sel.includes(c)) el.classList.add('selected');
            el.onclick = () => this.toggle(c, el);
            this.handDiv.appendChild(el);
        });
    },

    toggle(c, el) {
        if(this.sel.includes(c)) {
            this.sel = this.sel.filter(x => x !== c);
            el.classList.remove('selected');
        } else {
            this.sel.push(c);
            el.classList.add('selected');
        }
        
        const res = Rules.validate(gm.target, this.sel);
        
        // Sonderfall Joker Single: UI Input nötig
        if(this.sel.length===1 && this.sel[0].type === TYPE.JOKER) {
            this.btnPlay.innerText = "Wählen..."; this.btnPlay.disabled = false; this.btnPlay.classList.add('ready');
        } else if(res.ok) {
            this.btnPlay.innerText = `Legen`; this.btnPlay.disabled = false; this.btnPlay.classList.add('ready');
        } else {
            this.btnPlay.innerText = "Legen"; this.btnPlay.disabled = true; this.btnPlay.classList.remove('ready');
        }
    },

    tryPlay(jokerVal=null) {
        if(this.sel.length===1 && this.sel[0].type === TYPE.JOKER && !jokerVal) {
            document.getElementById('modal-overlay').style.display = 'flex';
            const grid = document.getElementById('joker-grid');
            grid.innerHTML = '';
            for(let i=1; i<=10; i++) {
                let b = document.createElement('button');
                b.innerText = i; b.style.padding="10px"; b.style.fontSize="1.2rem";
                b.className = "card number"; 
                b.onclick = () => {
                    document.getElementById('modal-overlay').style.display='none';
                    this.tryPlay(i);
                };
                grid.appendChild(b);
            }
            return;
        }
        gm.execute(gm.players[0], [...this.sel], jokerVal);
        this.sel = [];
        this.btnPlay.disabled = true; this.btnPlay.classList.remove('ready');
    },

    updateCenterCard(val) {
        this.centerCard.innerText = val;
        this.centerCard.classList.remove('pulse-anim');
        void this.centerCard.offsetWidth; 
        this.centerCard.classList.add('pulse-anim');
    },

    playAnimation(p, cards, onComplete) {
        let done = 0;
        cards.forEach((c, i) => {
            setTimeout(() => {
                let startEl;
                if(!p.isBot) {
                    startEl = document.createElement('div');
                    startEl.style.position='fixed'; startEl.style.left = '50%'; startEl.style.bottom = '100px';
                    document.body.appendChild(startEl);
                } else {
                    const oppIdx = gm.players.indexOf(p);
                    startEl = document.getElementById(`opp-${oppIdx}`);
                }
                
                const rect = startEl ? startEl.getBoundingClientRect() : {left:0, top:0};
                if(!p.isBot) document.body.removeChild(startEl);

                const fly = this.createCardEl(c);
                fly.className += " flying";
                fly.style.left = rect.left + 'px';
                fly.style.top = rect.top + 'px';
                document.body.appendChild(fly);

                const targetRect = this.centerCard.getBoundingClientRect();
                fly.offsetHeight; 
                fly.style.transform = `translate(${targetRect.left - rect.left}px, ${targetRect.top - rect.top}px) rotate(${Math.random()*180}deg) scale(0.5)`;
                fly.style.opacity = 0;

                setTimeout(() => {
                    fly.remove();
                    done++;
                    if(done === cards.length) onComplete();
                }, 450);
            }, i * 150);
        });
    },

    renderOpponents() {
        const area = document.getElementById('opponents-area');
        area.innerHTML = '';
        gm.players.forEach((p, i) => {
            if(i===0) return;
            const div = document.createElement('div');
            div.className = 'opponent';
            div.id = `opp-${i}`;
            div.innerHTML = `
                <div class="bubble" id="bubble-${i}"></div>
                <div style="font-size:2.5rem">👤</div>
                <div style="font-weight:bold">${p.name}</div>
                <div style="font-size:0.9rem">🖐 <span id="cnt-${i}">${p.hand.length}</span></div>
            `;
            area.appendChild(div);
        });
    },
    updateOpponents() {
        gm.players.forEach((p, i) => {
            if(i>0) document.getElementById(`cnt-${i}`).innerText = p.hand.length;
        });
    },
    updateActive(idx) {
        document.querySelectorAll('.opponent').forEach(e => e.classList.remove('active'));
        if(idx !== 0) document.getElementById(`opp-${idx}`).classList.add('active');
        this.handDiv.style.opacity = (idx===0) ? 1 : 0.5;
    },
    showBubble(idx, text) {
        const b = document.getElementById(`bubble-${idx}`);
        if(b) { b.innerText = text; b.style.opacity = 1; }
    },
    clearBubble() {
        document.querySelectorAll('.bubble').forEach(b => b.style.opacity = 0);
    },
    lock(locked) {
        this.handDiv.style.pointerEvents = locked ? 'none' : 'auto';
        this.btnDraw.disabled = locked;
        if(!locked && !gm.drawn) this.btnDraw.innerText = "Ziehen";
    },
    msg(t) { this.msgDiv.innerText = t; },
    showToast(t) {
        const el = document.getElementById('toast');
        el.innerText = t; el.style.opacity = 1;
        setTimeout(() => el.style.opacity=0, 2000);
    },
    updateDeckInfo() { document.getElementById('deck-info').innerText = "Karten: " + gm.deck.cards.length; }
};

function prepareGame(bots) {
    gm.init(bots);
    const starter = Math.floor(Math.random() * gm.players.length);
    gm.setTurn(starter);
}
function closeModal() { document.getElementById('modal-overlay').style.display='none'; }
</script>
</body>
</html>
