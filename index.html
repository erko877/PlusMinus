<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#2c3e50">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/erko877/PlusMinus/refs/heads/main/Logo.jpg">
    <link rel="icon" href="https://raw.githubusercontent.com/erko877/PlusMinus/refs/heads/main/Logo.jpg" type="image/jpg">
    
    <title>+- (PlusMinus)</title>
    <style>
        :root {
            --bg-color: #2c3e50;
            --bg-accent: #27ae60;
            /* Desktop Standardgrößen */
            --card-width: 68px; 
            --card-height: 100px;
            --radius: 10px;
            
            /* Farben */
            --c-olive: #8e9e6d;  
            --c-teal: #5e8b95;   
            --c-yellow: #d8a649; 
            --c-red: #b8523d;    
            --c-orange: #c36344; 
            
            --c-action-minus: #9d2b30;
            --c-action-joker: #5e2b55;
            --c-action-plus2: #c35a34;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            background: radial-gradient(circle at center, #34495e, #1a252f);
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            /* 100dvh garantiert, dass es auf iOS exakt passt */
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* --- HEADER --- */
        #top-bar {
            height: 50px; flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; 
            padding: 0 15px; background: rgba(0,0,0,0.2); font-size: 0.9rem;
        }
        .header-left { display: flex; gap: 10px; align-items: center; }
        #timer-display {
            font-family: monospace; font-size: 1.1rem; font-weight: bold; 
            background: rgba(0,0,0,0.3); padding: 3px 8px; border-radius: 5px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        #restart-btn {
            background: var(--c-action-minus); color: white; border: none; padding: 5px 12px;
            border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 0.8rem;
        }

        /* --- START SCREEN --- */
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(20, 30, 40, 0.98); z-index: 300;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .sel-btn-container { display: flex; gap: 20px; margin-top: 30px; }
        .sel-btn {
            width: 90px; height: 90px; border-radius: 50%; border: none;
            background: var(--c-yellow); color: #2c3e50; font-size: 1.5rem; font-weight: bold;
            cursor: pointer; box-shadow: 0 0 20px rgba(216, 166, 73, 0.3);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: transform 0.1s;
        }
        .sel-btn:active { transform: scale(0.95); }
        .sel-btn span { font-size: 0.8rem; margin-top: 5px; font-weight: normal; }

        /* --- GAME UI LAYOUT --- */
        #game-container {
            flex: 1; display: none; flex-direction: column; position: relative;
            justify-content: space-between; /* Verteilt Elemente vertikal */
        }

        #opponents-area {
            flex: 0 0 auto; height: 80px; 
            display: flex; justify-content: space-around; align-items: center;
        }
        .opponent { text-align: center; opacity: 0.6; transition: 0.3s; position: relative; }
        .opponent.active { opacity: 1; transform: scale(1.15); font-weight: bold; color: var(--c-yellow); }
        .bubble {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: white; color: #333; padding: 2px 8px; border-radius: 10px; font-size: 0.75rem;
            opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; font-weight:bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3); z-index: 50;
        }

        /* CENTER AREA */
        #play-area {
            flex: 1; /* Nimmt den meisten Platz */
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            position: relative;
        }

        #center-stack {
            position: relative; width: var(--card-width); height: var(--card-height);
            display: flex; justify-content: center; align-items: center;
        }
        
        #active-card {
            transform: scale(1.5); z-index: 10;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .pulse-anim { animation: pulse 0.4s; }
        @keyframes pulse { 50% { transform: scale(1.7); } }

        /* PLAYER AREA */
        #player-area {
            flex: 0 0 auto; /* Feste Höhe, schrumpft nicht */
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            display: flex; flex-direction: column; justify-content: flex-end; 
            padding-bottom: 5px;
        }
        #message-area { 
            text-align: center; height: 25px; color: var(--c-yellow); 
            font-weight: bold; font-size: 1rem; 
            text-shadow: 0 2px 2px rgba(0,0,0,0.8); margin-bottom: 2px; 
        }
        
        #hand-container {
            display: flex; 
            justify-content: center; 
            align-items: center;
            flex-wrap: wrap; 
            gap: 8px;
            padding: 5px 10px; 
            min-height: 110px;
        }

        /* --- CARD DESIGN --- */
        .card {
            width: var(--card-width); height: var(--card-height);
            border-radius: var(--radius);
            box-shadow: 2px 3px 8px rgba(0,0,0,0.3);
            cursor: pointer; position: relative;
            background: white; 
            display: flex; justify-content: center; align-items: center;
            transition: transform 0.2s; user-select: none;
            overflow: hidden;
            flex-shrink: 0; /* Karten sollen nicht zerquetscht werden */
        }

        /* Inner Layout */
        .card .corner { position: absolute; font-size: 0.9rem; font-weight: bold; line-height: 1; }
        .card .corner.tl { top: 6px; left: 6px; }
        .card .corner.br { bottom: 6px; right: 6px; transform: rotate(180deg); }
        .card .center { font-size: 2.8rem; font-weight: bold; line-height: 1; }

        /* --- COLORS --- */
        .card.val-1, .card.val-6 { color: var(--c-olive); }
        .card.val-2, .card.val-7 { color: var(--c-teal); }
        .card.val-3, .card.val-8 { color: var(--c-yellow); }
        .card.val-4, .card.val-10 { color: var(--c-red); }
        .card.val-5, .card.val-9 { color: var(--c-orange); }
        .card.val-6 .center, .card.val-9 .center { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 3px; }
        .card.val-6 .corner, .card.val-9 .corner { text-decoration: underline; }

        .card.plus { background-color: var(--c-olive); color: white; }
        .card.minus { background-color: var(--c-action-minus); color: white; }
        .card.skip { background-color: var(--c-teal); color: white; }
        .card.joker { background-color: var(--c-action-joker); color: white; }
        .card.draw2 { background-color: var(--c-action-plus2); color: white; }

        .card svg { fill: currentColor; width: 40px; height: 40px; }
        .card .corner svg { width: 12px; height: 12px; }

        .card.selected { 
            transform: translateY(-15px) scale(1.1); 
            box-shadow: 0 0 15px var(--c-yellow); 
            z-index: 100; border: 2px solid var(--c-yellow);
        }
        .flying { position: fixed; z-index: 1000; pointer-events: none; transition: all 0.5s ease-in-out; }

        /* CONTROLS */
        #controls { 
            display: flex; justify-content: center; gap: 20px; padding: 10px; 
            padding-bottom: max(10px, env(safe-area-inset-bottom)); /* Respect Home Bar */
            flex-shrink: 0;
        }
        button.game-btn {
            padding: 12px 30px; border-radius: 12px; border: none; font-weight: bold; font-size: 1rem;
            box-shadow: 0 4px 0 rgba(0,0,0,0.3); cursor: pointer; transition: all 0.1s; width: 120px;
        }
        button.game-btn:active { transform: translateY(4px); box-shadow: none; }
        #btn-draw { background: #ecf0f1; color: #333; }
        #btn-play { background: #27ae60; color: white; opacity: 0.5; }
        #btn-play.ready { opacity: 1; animation: glow 1.5s infinite; background: #2ecc71; }
        @keyframes glow { 0% { box-shadow: 0 0 5px #2ecc71; } 50% { box-shadow: 0 0 20px #2ecc71; } 100% { box-shadow: 0 0 5px #2ecc71; } }

        /* MODALS & TOAST */
        #modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 500;
        }
        .modal-box { background: white; color: #333; padding: 25px; border-radius: 15px; text-align: center; width: 90%; max-width: 320px; }
        .grid-1-10 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 20px; }
        #toast {
            position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.9); padding: 10px 25px; border-radius: 30px; color: white;
            pointer-events: none; opacity: 0; transition: opacity 0.5s; z-index: 400; font-weight: bold;
        }

        /* ----------------------------------------------------------- */
        /* MOBILE OPTIMIERUNG (Compact Mode für Handys) */
        /* ----------------------------------------------------------- */
        @media (max-width: 768px) {
            /* 1. Platz sparen im Layout */
            #opponents-area { height: 70px; }
            .opponent { transform: scale(0.9); }
            #active-card { transform: scale(1.3); } 
            
            /* 2. Handkarten: Eine Reihe, notfalls Scrollen/Quetschen */
            #hand-container {
                flex-wrap: nowrap; /* Erzwingt eine Zeile */
                justify-content: flex-start; /* Start links bei vielen Karten */
                overflow-x: auto; /* Scrollbar erlauben wenn nötig */
                padding: 5px 15px;
                gap: 5px;
                height: 95px; /* Kompakter */
                min-height: 0;
                
                /* Scrollbar unsichtbar machen */
                scrollbar-width: none; 
                -ms-overflow-style: none;
            }
            #hand-container::-webkit-scrollbar { display: none; }

            /* 3. Karten kleiner machen, damit mehr auf den Screen passen */
            :root {
                --card-width: 55px;
                --card-height: 82px;
                --radius: 6px;
            }
            .card .center { font-size: 2rem; }
            .card svg { width: 30px; height: 30px; }
            .card .corner { font-size: 0.7rem; }
            .card.selected { transform: translateY(-15px) scale(1.1); } /* Weniger Lift */

            /* 4. Controls anpassen */
            #controls { padding: 10px; gap: 10px; }
            button.game-btn { padding: 12px 20px; font-size: 0.9rem; width: 100px; }
        }
    </style>
</head>
<body>

<div id="top-bar">
    <div class="header-left">
        <div style="font-weight:900; font-size:1.2rem;">+-</div>
        <div id="timer-display">00:00</div>
    </div>
    <div style="display:flex; gap:10px; align-items:center;">
        <span id="deck-info" style="opacity:0.8; font-size:0.8rem;"></span>
        <button id="restart-btn" onclick="location.reload()">↺</button>
    </div>
</div>

<!-- START SCREEN -->
<div id="start-screen">
    <h1 style="color:white; font-size:4rem; margin:0; text-shadow:0 6px 15px black;">+-</h1>
    <p style="color:#bdc3c7;">Strategisches Rechenspiel - by GoldGames</p>
    <div class="sel-btn-container">
        <button class="sel-btn" onclick="prepareGame(1)">1<span>Gegner</span></button>
        <button class="sel-btn" onclick="prepareGame(2)">2<span>Gegner</span></button>
        <button class="sel-btn" onclick="prepareGame(3)">3<span>Gegner</span></button>
    </div>
</div>

<!-- GAME UI -->
<div id="game-container">
    <div id="opponents-area"></div>

    <div id="play-area">
        <div id="center-stack">
            <!-- AKTIVE KARTE (Wird per JS gefüllt) -->
        </div>
    </div>

    <div id="player-area">
        <div id="message-area"></div>
        <div id="hand-container"></div>
    </div>
</div>

<div id="controls">
    <button id="btn-draw" class="game-btn">Ziehen</button>
    <button id="btn-play" class="game-btn" disabled>Legen</button>
</div>

<div id="toast">Nachricht</div>

<div id="modal-overlay">
    <div class="modal-box">
        <h3>Wähle eine Zahl</h3>
        <div class="grid-1-10" id="joker-grid"></div>
        <button style="margin-top:15px; background:#95a5a6; border:none; padding:10px; border-radius:5px; color:white; font-weight:bold; cursor:pointer;" onclick="closeModal()">Abbrechen</button>
    </div>
</div>

<script>
/**
 * ------------------------------------------------------------------
 * LOGIK (MODEL)
 * ------------------------------------------------------------------
 */
const TYPE = { NUMBER:'number', PLUS:'plus', MINUS:'minus', JOKER:'joker', SKIP:'skip', DRAW2:'draw2' };

class Card {
    constructor(type, value=null) {
        this.type = type;
        this.value = value;
        this.id = Math.random().toString(36).substring(2);
    }
    
    // Für die Logik
    getSortIndex() { return Math.random(); }
}

class Deck {
    constructor() { this.init(); }
    init() {
        this.cards = []; this.discardPile = [];
        // 106 Karten
        for(let i=1; i<=10; i++) for(let k=0; k<7; k++) this.cards.push(new Card(TYPE.NUMBER, i));
        for(let k=0; k<11; k++) { this.cards.push(new Card(TYPE.PLUS)); this.cards.push(new Card(TYPE.MINUS)); }
        for(let k=0; k<4; k++) this.cards.push(new Card(TYPE.JOKER));
        for(let k=0; k<6; k++) this.cards.push(new Card(TYPE.SKIP));
        for(let k=0; k<4; k++) this.cards.push(new Card(TYPE.DRAW2));
        this.shuffle(this.cards);
    }
    shuffle(arr) {
        for(let i=arr.length-1; i>0; i--) {
            const j = Math.floor(Math.random()*(i+1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
    }
    draw() {
        if(this.cards.length===0) {
            if(this.discardPile.length===0) return null;
            this.cards = [...this.discardPile]; this.discardPile=[]; this.shuffle(this.cards);
            ui.showToast("Deck neu gemischt");
        }
        return this.cards.pop();
    }
}

class Rules {
    static validate(target, cards, jokerVal=null) {
        if(cards.length === 0) return { ok: false };
        const c0 = cards[0];

        // 1. EINZELKARTE
        if(cards.length === 1) {
            if(c0.type === TYPE.NUMBER) return c0.value === target ? { ok: true, nextTarget: c0.value } : { ok: false };
            if(c0.type === TYPE.JOKER) return jokerVal ? { ok: true, nextTarget: jokerVal, isJoker: true } : { ok: true, needInput: true };
            if(c0.type === TYPE.SKIP) return { ok: true, isSkip: true, nextTarget: target };
            if(c0.type === TYPE.DRAW2) return { ok: true, isDraw2: true, nextTarget: target };
            return { ok: false };
        }

        // 2. KETTE (Joker Solver)
        return this.solveChain(target, cards, 0, 0, null);
    }

    static solveChain(target, cards, index, currentVal, lastNumVal) {
        // Simple iterative solver with state tracking for Joker branches
        let paths = [{ val: 0, lastNum: 0, waitingForOp: false, lastOp: null }]; 

        for (let i = 0; i < cards.length; i++) {
            const c = cards[i];
            let newPaths = [];

            for (let p of paths) {
                // Erwartet Zahl
                if (!p.waitingForOp) {
                    let nums = [];
                    if (c.type === TYPE.NUMBER) nums.push(c.value);
                    else if (c.type === TYPE.JOKER) {
                        for(let n=1; n<=10; n++) nums.push(n); 
                    } else continue; 

                    for (let n of nums) {
                        let newVal = p.val;
                        if (i === 0) newVal = n;
                        else {
                            if (p.lastOp === '+') newVal += n;
                            else if (p.lastOp === '-') newVal -= n;
                        }
                        newPaths.push({ val: newVal, lastNum: n, waitingForOp: true, lastOp: null });
                    }
                } 
                // Erwartet Operator
                else {
                    let ops = [];
                    if (c.type === TYPE.PLUS) ops.push('+');
                    else if (c.type === TYPE.MINUS) ops.push('-');
                    else if (c.type === TYPE.JOKER) { ops.push('+'); ops.push('-'); }
                    else continue;

                    for (let op of ops) {
                        newPaths.push({ val: p.val, lastNum: p.lastNum, waitingForOp: false, lastOp: op });
                    }
                }
            }
            paths = newPaths;
        }

        for (let p of paths) {
            if (p.waitingForOp && p.val === target) {
                return { ok: true, nextTarget: p.lastNum };
            }
        }
        return { ok: false };
    }
}

/**
 * ------------------------------------------------------------------
 * GAME STATE
 * ------------------------------------------------------------------
 */
const gm = {
    deck: null,
    players: [],
    turn: 0,
    target: 5,
    active: false,
    drawn: false,
    timerInterval: null,
    startTime: 0,
    initialCard: null,

    init(botCount) {
        this.deck = new Deck();
        this.players = [{ name:"DU", isBot:false, hand:[] }];
        for(let i=1; i<=botCount; i++) this.players.push({ name:`Bot ${i}`, isBot:true, hand:[] });
        
        this.players.forEach(p => {
            for(let i=0; i<10; i++) p.hand.push(this.deck.draw());
        });

        let c = this.deck.draw();
        while(c.type !== TYPE.NUMBER) {
            this.deck.discardPile.push(c);
            c = this.deck.draw();
        }
        this.target = c.value;
        this.initialCard = c;
    },

    setTurn(idx) {
        this.turn = idx;
        this.active = true;
        this.startTimer();
        ui.initGameScreen();
        ui.showToast(`${this.players[idx].name} fängt an!`);
        this.nextTurn(false);
    },

    startTimer() {
        this.startTime = Date.now();
        if(this.timerInterval) clearInterval(this.timerInterval);
        this.timerInterval = setInterval(() => {
            const diff = Math.floor((Date.now() - this.startTime) / 1000);
            const m = Math.floor(diff / 60).toString().padStart(2,'0');
            const s = (diff % 60).toString().padStart(2,'0');
            document.getElementById('timer-display').innerText = `${m}:${s}`;
        }, 1000);
    },

    nextTurn(advance=true) {
        if(!this.active) return;
        if(advance) this.turn = (this.turn + 1) % this.players.length;
        this.drawn = false;
        
        const p = this.players[this.turn];
        ui.updateActive(this.turn);
        ui.clearBubble();

        if(p.isBot) {
            ui.lock(true);
            setTimeout(() => this.botMove(p), 1200);
        } else {
            ui.lock(false);
            ui.msg(`Ziel: ${this.target} | Du bist dran!`);
        }
    },

    handleDraw(p) {
        const c = this.deck.draw();
        if(!c) return;
        p.hand.push(c);
        ui.updateDeckInfo();

        if(p.isBot) {
            ui.showBubble(this.turn, "Zieht...");
            ui.updateOpponents();
            setTimeout(() => this.nextTurn(), 1000);
        } else {
            ui.renderHand(p);
            this.drawn = true;
            ui.msg("Gezogen. Spielen?");
            ui.btnDraw.innerText = "Weiter";
        }
    },

    execute(p, cards, jokerVal) {
        const res = Rules.validate(this.target, cards, jokerVal);
        if(!res.ok) return;

        p.hand = p.hand.filter(c => !cards.includes(c));
        cards.forEach(c => this.deck.discardPile.push(c));
        
        ui.playAnimation(p, cards, () => {
            this.target = res.nextTarget;
            ui.updateCenterCard(this.target, cards[cards.length-1]);
            ui.updateOpponents();
            if(!p.isBot) ui.renderHand(p);

            if(p.hand.length === 0) {
                this.active = false;
                clearInterval(this.timerInterval);
                setTimeout(() => alert(p.name + " hat gewonnen!"), 200);
                return;
            }

            if(res.isSkip) {
                ui.showBubble(this.turn, "🚫 Aussetzer!");
                this.turn = (this.turn + 1) % this.players.length; 
                setTimeout(() => this.nextTurn(), 1500);
            } 
            else if(res.isDraw2) {
                ui.showBubble(this.turn, "💥 +2 Karten!");
                const victimIdx = (this.turn + 1) % this.players.length;
                const victim = this.players[victimIdx];
                victim.hand.push(this.deck.draw());
                victim.hand.push(this.deck.draw());
                if(victimIdx === 0) {
                    ui.msg("Du musst 2 ziehen!");
                    ui.renderHand(victim);
                } else {
                    ui.showBubble(victimIdx, "Muss 2 ziehen...");
                    ui.updateOpponents();
                }
                this.turn = victimIdx; 
                setTimeout(() => this.nextTurn(), 2000);
            } 
            else {
                this.nextTurn();
            }
        });
    },

    botMove(p) {
        const t = this.target;
        const special = p.hand.find(c => c.type === TYPE.DRAW2 || c.type === TYPE.SKIP);
        if(special && Math.random() > 0.6) return this.execute(p, [special]);

        const match = p.hand.find(c => c.type === TYPE.NUMBER && c.value === t);
        if(match) return this.execute(p, [match]);

        const nums = p.hand.filter(c => c.type === TYPE.NUMBER);
        const ops = p.hand.filter(c => c.type === TYPE.PLUS || c.type === TYPE.MINUS || c.type === TYPE.JOKER);

        for(let n1 of nums) {
            for(let op of ops) {
                for(let n2 of nums) {
                    if(n1 === n2) continue;
                    if(Rules.validate(t, [n1, op, n2]).ok) return this.execute(p, [n1, op, n2]);
                }
            }
        }
        
        const joker = p.hand.find(c => c.type === TYPE.JOKER);
        if(joker) return this.execute(p, [joker], Math.floor(Math.random()*10)+1);

        this.handleDraw(p);
    }
};

/**
 * ------------------------------------------------------------------
 * UI MANAGER
 * ------------------------------------------------------------------
 */
const ui = {
    sel: [],
    
    initGameScreen() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('game-container').style.display = 'flex';
        this.btnDraw = document.getElementById('btn-draw');
        this.btnPlay = document.getElementById('btn-play');
        this.handDiv = document.getElementById('hand-container');
        this.centerStack = document.getElementById('center-stack');
        this.msgDiv = document.getElementById('message-area');

        this.btnDraw.onclick = () => {
            if(gm.drawn) gm.nextTurn();
            else gm.handleDraw(gm.players[0]);
        };
        this.btnPlay.onclick = () => this.tryPlay();
        
        this.renderOpponents();
        this.renderHand(gm.players[0]);
        this.updateDeckInfo();
        if(gm.initialCard) this.updateCenterCard(gm.target, gm.initialCard);
    },

    // --- HTML GENERATOR FOR CARDS ---
    createCardEl(c, small=false) {
        const div = document.createElement('div');
        div.className = `card ${c.type}`;
        if(c.type === TYPE.NUMBER) div.classList.add(`val-${c.value}`);
        
        // Define Symbol
        let symbol = "";
        if(c.type === TYPE.NUMBER) symbol = c.value;
        else if(c.type === TYPE.PLUS) symbol = "+";
        else if(c.type === TYPE.MINUS) symbol = "−"; 
        else if(c.type === TYPE.SKIP) symbol = "II"; 
        else if(c.type === TYPE.DRAW2) symbol = "+2";
        else if(c.type === TYPE.JOKER) {
            symbol = `<svg viewBox="0 0 512 512"><path d="M416 112c-29.3 0-56.1 9.5-77.9 25.5L256 32 173.9 137.5C152.1 121.5 125.3 112 96 112c-53 0-96 43-96 96 0 35.5 19.3 66.6 48 83.2V352c0 17.7 14.3 32 32 32h352c17.7 0 32-14.3 32-32v-60.8c28.7-16.6 48-47.7 48-83.2 0-53-43-96-96-96z"/></svg>`;
        }

        div.innerHTML = `
            <span class="corner tl">${symbol}</span>
            <span class="center">${symbol}</span>
            <span class="corner br">${symbol}</span>
        `;

        if(small) { div.style.width='40px'; div.style.height='60px'; }
        return div;
    },

    renderHand(p) {
        this.handDiv.innerHTML = '';
        p.hand.forEach(c => {
            const el = this.createCardEl(c);
            if(this.sel.includes(c)) el.classList.add('selected');
            el.onclick = () => this.toggle(c, el);
            this.handDiv.appendChild(el);
        });
    },

    toggle(c, el) {
        if(this.sel.includes(c)) {
            this.sel = this.sel.filter(x => x !== c);
            el.classList.remove('selected');
        } else {
            this.sel.push(c);
            el.classList.add('selected');
        }
        
        const res = Rules.validate(gm.target, this.sel);
        if(this.sel.length===1 && this.sel[0].type === TYPE.JOKER) {
            this.btnPlay.innerText = "Wählen..."; this.btnPlay.disabled = false; this.btnPlay.classList.add('ready');
        } else if(res.ok) {
            this.btnPlay.innerText = `Legen`; this.btnPlay.disabled = false; this.btnPlay.classList.add('ready');
        } else {
            this.btnPlay.innerText = "Legen"; this.btnPlay.disabled = true; this.btnPlay.classList.remove('ready');
        }
    },

    tryPlay(jokerVal=null) {
        if(this.sel.length===1 && this.sel[0].type === TYPE.JOKER && !jokerVal) {
            document.getElementById('modal-overlay').style.display = 'flex';
            const grid = document.getElementById('joker-grid');
            grid.innerHTML = '';
            for(let i=1; i<=10; i++) {
                let b = document.createElement('button');
                b.innerText = i; b.style.padding="10px"; b.style.fontSize="1.2rem";
                b.className = "game-btn"; b.style.background="var(--c-yellow)";
                b.onclick = () => {
                    document.getElementById('modal-overlay').style.display='none';
                    this.tryPlay(i);
                };
                grid.appendChild(b);
            }
            return;
        }
        gm.execute(gm.players[0], [...this.sel], jokerVal);
        this.sel = [];
        this.btnPlay.disabled = true; this.btnPlay.classList.remove('ready');
    },

    // Hier wird das visuelle Ergebnis (Karte in der Mitte) gerendert
    updateCenterCard(val, sourceCard) {
        const stack = document.getElementById('center-stack');
        stack.innerHTML = ''; // Clean old
        
        // Wir erstellen eine visuelle Karte basierend auf dem Wert (und Typ falls verfügbar)
        let displayCard;
        if(sourceCard && sourceCard.type === TYPE.NUMBER) {
            displayCard = sourceCard; // Originalkarte verwenden (für Farbe)
        } else {
            // Fallback für berechnete Werte (z.B. aus Joker)
            displayCard = new Card(TYPE.NUMBER, val);
        }
        
        const el = this.createCardEl(displayCard);
        el.id = "active-card";
        el.classList.add('pulse-anim');
        stack.appendChild(el);
    },

    playAnimation(p, cards, onComplete) {
        let done = 0;
        cards.forEach((c, i) => {
            setTimeout(() => {
                let startEl;
                if(!p.isBot) {
                    startEl = document.createElement('div');
                    startEl.style.position='fixed'; startEl.style.left = '50%'; startEl.style.bottom = '100px';
                    document.body.appendChild(startEl);
                } else {
                    const oppIdx = gm.players.indexOf(p);
                    startEl = document.getElementById(`opp-${oppIdx}`);
                }
                
                const rect = startEl ? startEl.getBoundingClientRect() : {left:0, top:0};
                if(!p.isBot) document.body.removeChild(startEl);

                const fly = this.createCardEl(c);
                fly.className += " flying";
                fly.style.left = rect.left + 'px';
                fly.style.top = rect.top + 'px';
                document.body.appendChild(fly);

                const targetRect = document.getElementById('center-stack').getBoundingClientRect();
                fly.offsetHeight; 
                
                fly.style.transform = `translate(${targetRect.left - rect.left}px, ${targetRect.top - rect.top}px) rotate(${Math.random()*180}deg) scale(0.5)`;
                fly.style.opacity = 0;

                setTimeout(() => {
                    fly.remove();
                    done++;
                    if(done === cards.length) onComplete();
                }, 450);
            }, i * 150);
        });
    },

    renderOpponents() {
        const area = document.getElementById('opponents-area');
        area.innerHTML = '';
        gm.players.forEach((p, i) => {
            if(i===0) return;
            const div = document.createElement('div');
            div.className = 'opponent';
            div.id = `opp-${i}`;
            div.innerHTML = `
                <div class="bubble" id="bubble-${i}"></div>
                <div style="font-size:2.5rem">👤</div>
                <div style="font-weight:bold">${p.name}</div>
                <div style="font-size:0.9rem">🖐 <span id="cnt-${i}">${p.hand.length}</span></div>
            `;
            area.appendChild(div);
        });
    },
    updateOpponents() {
        gm.players.forEach((p, i) => {
            if(i>0) document.getElementById(`cnt-${i}`).innerText = p.hand.length;
        });
    },
    updateActive(idx) {
        document.querySelectorAll('.opponent').forEach(e => e.classList.remove('active'));
        if(idx !== 0) document.getElementById(`opp-${idx}`).classList.add('active');
        this.handDiv.style.opacity = (idx===0) ? 1 : 0.5;
    },
    showBubble(idx, text) {
        const b = document.getElementById(`bubble-${idx}`);
        if(b) { b.innerText = text; b.style.opacity = 1; }
    },
    clearBubble() {
        document.querySelectorAll('.bubble').forEach(b => b.style.opacity = 0);
    },
    lock(locked) {
        this.handDiv.style.pointerEvents = locked ? 'none' : 'auto';
        this.btnDraw.disabled = locked;
        if(!locked && !gm.drawn) this.btnDraw.innerText = "Ziehen";
    },
    msg(t) { this.msgDiv.innerText = t; },
    showToast(t) {
        const el = document.getElementById('toast');
        el.innerText = t; el.style.opacity = 1;
        setTimeout(() => el.style.opacity=0, 2000);
    },
    updateDeckInfo() { document.getElementById('deck-info').innerText = "Karten: " + gm.deck.cards.length; }
};

function prepareGame(bots) {
    gm.init(bots);
    const starter = Math.floor(Math.random() * gm.players.length);
    gm.setTurn(starter);
}
function closeModal() { document.getElementById('modal-overlay').style.display='none'; }
</script>
</body>
</html>
